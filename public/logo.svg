<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <defs>
    <!-- Pink-to-magenta gradient for the "b" letter -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3191"/>
      <stop offset="45%" stop-color="#C0339A"/>
      <stop offset="100%" stop-color="#EC008C"/>
    </linearGradient>
    <!-- Subtle inner glow -->
    <radialGradient id="bHighlight" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Stylized "b" — bowl + ascender tail forming the blix "b" icon -->
  <!-- Ascender (vertical stroke top-left curving down) -->
  <path d="
    M 18 8
    C 14 8, 10 12, 10 18
    L 10 68
    C 10 74, 13 78, 17 80
    C 21 82, 26 81, 30 78
    C 36 74, 40 66, 40 58
    C 40 48, 34 40, 26 38
    C 32 35, 38 28, 38 18
    C 38 12, 33 6, 26 6
    Z
  " fill="url(#bGrad)" opacity="0"/>

  <!-- Clean "b" shape matching the screenshot — thick rounded stroke style -->
  <!-- Vertical left stroke -->
  <rect x="10" y="6" width="11" height="72" rx="5.5" fill="url(#bGrad)"/>
  <!-- Bowl of the b — right side circle -->
  <circle cx="36" cy="60" r="22" fill="url(#bGrad)"/>
  <!-- Punch out inner circle of bowl -->
  <circle cx="36" cy="60" r="12" fill="white"/>
  <!-- Connect left stroke to bowl -->
  <rect x="10" y="48" width="26" height="11" fill="url(#bGrad)"/>
  <!-- Rounded tail at top of ascender -->
  <circle cx="15.5" cy="11.5" r="5.5" fill="url(#bGrad)"/>
  <!-- Rounded bottom of ascender -->
  <circle cx="15.5" cy="72.5" r="5.5" fill="url(#bGrad)"/>
  <!-- Highlight overlay -->
  <circle cx="36" cy="60" r="22" fill="url(#bHighlight)"/>

  <!-- "LIX" text in bold dark navy -->
  <text
    x="75"
    y="72"
    font-family="Manrope, 'Segoe UI', Arial, sans-serif"
    font-weight="800"
    font-size="54"
    fill="#1A1D5C"
    letter-spacing="1"
  >LIX</text>

  <!-- "technologies" small text -->
  <text
    x="77"
    y="92"
    font-family="Inter, 'Segoe UI', Arial, sans-serif"
    font-weight="400"
    font-size="14"
    fill="#6B6E99"
    letter-spacing="2.5"
  >technologies</text>
</svg>
